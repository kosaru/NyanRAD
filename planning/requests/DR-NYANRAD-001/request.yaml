# 内部受付記録。正式要件・実装指示ではない。
development_request:
  request_id: DR-NYANRAD-001
  title: NyanQL群のソースコードを生成するブラウザ型ビジュアル開発環境
  status: approved-for-requirements
  requester_intent:
    statement: NyanQLフレームワーク群をVB6のような統合開発環境で使えるようにする。ブラウザでポトペタ編集でき、生成物は同群の体裁を保ったソースコードとする
  background:
    current_situation:
      - 要求者がkosaru/NyanRADを作成した
      - ブラウザ上で動くVB6に近い開発環境を検討している
    problem:
      - 要求者はAccess型の仕組みには敷居の高さを感じている
      - ファイルを個別に編集する手間があり、画面作成から実行まで一つの環境で進めたい
  target_users:
    - NyanQL群でアプリを作る開発者
  expected_change:
    - 画面上の部品配置で画面を作成できる
    - 生成物をNyanQLフレームワーク群の体裁に沿うソースコードとして扱える
  success_indicators:
    - 画面作成から処理編集・実行・保存・再編集まで一つの環境で進められる
    - ファイルを個別に編集する手間が減る（定量目標は未設定）
  initial_scope:
    included:
      - ブラウザ上のVB6風画面作成とソースコード生成という構想
      - NyanPUI・Nyan8・NyanQLを扱う開発環境
      - NyanPUIからNyanQLへの直接接続とNyan8経由の接続
      - まずNyanQL内蔵DBを利用する方向（SQLite・DuckDBを検討）
      - initial-scope-options.mdの初回候補を検討の軸とする
    excluded:
      - initial-scope-options.mdの後続候補を初回対象外の検討の軸とする（詳細は要件定義で具体化）
  constraints:
    - 初回はmacOSでのローカル利用を対象として進める
    - 生成物はソースコードとするという要求者の前提
    - NyanQLフレームワーク群の体裁を保つという要求者の前提
  dependencies:
    - NyanPUI・Nyan8・NyanQL（採用バージョンは未決定）
    - NyanQL群の実行ファイルは要求者側で用意する
  unknowns:
    - 共有利用等の利用条件と定量的な成功指標（特定業務アプリへの限定は前提としない）
    - 初期版の詳細範囲と対象外
    - 既定DB、SQLite・DuckDBの初回対応範囲、実行ファイルの版と配置
    - 生成形式、追加依存、手編集後の再編集範囲
    - 開発言語、配置方式、macOSの最低版・CPU構成・対応ブラウザ
    - ローカルでの保存方式、実行権限、公開方法
    - 期限、予算、ライセンス、受入条件
    - 初回開発中の正式要件保管とブランチ対応、正式版への切替記録、次版フォーク先
  additional_research:
    - 採用候補版のディレクトリ構成・設定・実行仕様の確認
    - ソースコード生成と画面再編集の技術的な制約の確認
