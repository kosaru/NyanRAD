<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="496" viewBox="0 0 1320 496"><style>text{font-family:system-ui,sans-serif;fill:#203047;font-size:14px}rect{stroke:#9aacbd;fill:#f5f8fc}.title{font-size:22px;font-weight:bold}</style><text x="20" y="34" class="title">サーバー処理・SQLと接続を編集する — draft</text><text x="20" y="62">各行：画面 → 操作 → 機能 → データ操作 → 画面へ返す結果</text><text x="20" y="103">INT-NYANRAD-003-OPEN [normal]</text><rect x="20" y="114" width="244" height="82" rx="5"/><text x="28" y="134">製品別の処理・SQL・設定</text><text x="267" y="160">→</text><rect x="280" y="114" width="244" height="82" rx="5"/><text x="288" y="134">対象を開く</text><text x="527" y="160">→</text><rect x="540" y="114" width="244" height="82" rx="5"/><text x="548" y="134">製品別ソースを取得する</text><text x="787" y="160">→</text><rect x="800" y="114" width="244" height="82" rx="5"/><text x="808" y="134">R：サーバー処理・SQL・AP</text><text x="808" y="151">I・DB設定、C：編集状態</text><text x="1047" y="160">→</text><rect x="1060" y="114" width="244" height="82" rx="5"/><text x="1068" y="134">製品・実行場所・ソースを表示す</text><text x="1068" y="151">る</text><text x="20" y="235">INT-NYANRAD-003-EDIT [normal]</text><rect x="20" y="246" width="244" height="82" rx="5"/><text x="28" y="266">製品別の処理・SQL・設定</text><text x="267" y="292">→</text><rect x="280" y="246" width="244" height="82" rx="5"/><text x="288" y="266">本文・設定変更</text><text x="527" y="292">→</text><rect x="540" y="246" width="244" height="82" rx="5"/><text x="548" y="266">処理と接続の編集内容を反映する</text><text x="787" y="292">→</text><rect x="800" y="246" width="244" height="82" rx="5"/><text x="808" y="266">R：サーバー処理・SQL・AP</text><text x="808" y="283">I・DB設定、C/U：編集状態</text><text x="1047" y="292">→</text><rect x="1060" y="246" width="244" height="82" rx="5"/><text x="1068" y="266">編集内容と未保存状態を表示する</text><text x="20" y="367">INT-NYANRAD-003-ERROR [exception]</text><rect x="20" y="378" width="244" height="82" rx="5"/><text x="28" y="398">製品別の処理・SQL・設定</text><text x="267" y="424">→</text><rect x="280" y="378" width="244" height="82" rx="5"/><text x="288" y="398">不正な設定を読む・編集する</text><text x="527" y="424">→</text><rect x="540" y="378" width="244" height="82" rx="5"/><text x="548" y="398">処理と設定の問題を表示する</text><text x="787" y="424">→</text><rect x="800" y="378" width="244" height="82" rx="5"/><text x="808" y="398">R：サーバー処理・SQL・AP</text><text x="808" y="415">I・DB設定、R：編集状態</text><text x="1047" y="424">→</text><rect x="1060" y="378" width="244" height="82" rx="5"/><text x="1068" y="398">対象と問題を示し元ソースを保持</text><text x="1068" y="415">する</text></svg>