<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1024" viewBox="0 0 1320 1024"><style>text{font-family:system-ui,sans-serif;fill:#203047;font-size:14px}rect{stroke:#9aacbd;fill:#f5f8fc}.title{font-size:22px;font-weight:bold}</style><text x="20" y="34" class="title">アプリを実行して動作を確認する — draft</text><text x="20" y="62">各行：画面 → 操作 → 機能 → データ操作 → 画面へ返す結果</text><text x="20" y="103">INT-NYANRAD-004-START [normal]</text><rect x="20" y="114" width="244" height="82" rx="5"/><text x="28" y="134">実行操作・プレビュー・ログ</text><text x="267" y="160">→</text><rect x="280" y="114" width="244" height="82" rx="5"/><text x="288" y="134">実行</text><text x="527" y="160">→</text><rect x="540" y="114" width="244" height="82" rx="5"/><text x="548" y="134">実行条件を確認して対象を起動す</text><text x="548" y="151">る</text><text x="787" y="160">→</text><rect x="800" y="114" width="244" height="82" rx="5"/><text x="808" y="134">R：保存結果・通常ソース・実行</text><text x="808" y="151">設定、C/U：実行対象・所有確</text><text x="808" y="168">認・実行状態</text><text x="1047" y="160">→</text><rect x="1060" y="114" width="244" height="82" rx="5"/><text x="1068" y="134">対象ごとの起動結果とプレビュー</text><text x="1068" y="151">先を表示する</text><text x="20" y="235">INT-NYANRAD-004-BLOCK [exception]</text><rect x="20" y="246" width="244" height="82" rx="5"/><text x="28" y="266">実行操作・プレビュー・ログ</text><text x="267" y="292">→</text><rect x="280" y="246" width="244" height="82" rx="5"/><text x="288" y="266">実行</text><text x="527" y="292">→</text><rect x="540" y="246" width="244" height="82" rx="5"/><text x="548" y="266">部分保存での起動を止める</text><text x="787" y="292">→</text><rect x="800" y="246" width="244" height="82" rx="5"/><text x="808" y="266">R：保存結果・通常ソース・実行</text><text x="808" y="283">設定、R：実行対象・所有確認・</text><text x="808" y="300">実行状態</text><text x="1047" y="292">→</text><rect x="1060" y="246" width="244" height="82" rx="5"/><text x="1068" y="266">新規起動せず解消すべき対象を表</text><text x="1068" y="283">示する</text><text x="20" y="367">INT-NYANRAD-004-PARTIAL [exception]</text><rect x="20" y="378" width="244" height="82" rx="5"/><text x="28" y="398">実行操作・プレビュー・ログ</text><text x="267" y="424">→</text><rect x="280" y="378" width="244" height="82" rx="5"/><text x="288" y="398">起動結果を受ける</text><text x="527" y="424">→</text><rect x="540" y="378" width="244" height="82" rx="5"/><text x="548" y="398">一部起動失敗から回復する</text><text x="787" y="424">→</text><rect x="800" y="378" width="244" height="82" rx="5"/><text x="808" y="398">R/U：実行対象・所有確認・実</text><text x="808" y="415">行状態、R：取得可能なログ・エ</text><text x="808" y="432">ラー</text><text x="1047" y="424">→</text><rect x="1060" y="378" width="244" height="82" rx="5"/><text x="1068" y="398">今回起動した対象だけを停止し失</text><text x="1068" y="415">敗・不明も表示する</text><text x="20" y="499">INT-NYANRAD-004-STOP [normal]</text><rect x="20" y="510" width="244" height="82" rx="5"/><text x="28" y="530">実行操作・プレビュー・ログ</text><text x="267" y="556">→</text><rect x="280" y="510" width="244" height="82" rx="5"/><text x="288" y="530">停止</text><text x="527" y="556">→</text><rect x="540" y="510" width="244" height="82" rx="5"/><text x="548" y="530">管理対象の停止を確認する</text><text x="787" y="556">→</text><rect x="800" y="510" width="244" height="82" rx="5"/><text x="808" y="530">R/U：実行対象・所有確認・実</text><text x="808" y="547">行状態</text><text x="1047" y="556">→</text><rect x="1060" y="510" width="244" height="82" rx="5"/><text x="1068" y="530">実際の終了確認を停止結果として</text><text x="1068" y="547">表示する</text><text x="20" y="631">INT-NYANRAD-004-UNKNOWN [exception]</text><rect x="20" y="642" width="244" height="82" rx="5"/><text x="28" y="662">実行操作・プレビュー・ログ</text><text x="267" y="688">→</text><rect x="280" y="642" width="244" height="82" rx="5"/><text x="288" y="662">状態確認・停止</text><text x="527" y="688">→</text><rect x="540" y="642" width="244" height="82" rx="5"/><text x="548" y="662">確認不能な実行状態を表示する</text><text x="787" y="688">→</text><rect x="800" y="642" width="244" height="82" rx="5"/><text x="808" y="662">R/U：実行対象・所有確認・実</text><text x="808" y="679">行状態、R：取得可能なログ・エ</text><text x="808" y="696">ラー</text><text x="1047" y="688">→</text><rect x="1060" y="642" width="244" height="82" rx="5"/><text x="1068" y="662">不明・失敗を停止済みと区別し自</text><text x="1068" y="679">動強制終了しない</text><text x="20" y="763">INT-NYANRAD-004-LOG [normal]</text><rect x="20" y="774" width="244" height="82" rx="5"/><text x="28" y="794">実行操作・プレビュー・ログ</text><text x="267" y="820">→</text><rect x="280" y="774" width="244" height="82" rx="5"/><text x="288" y="794">ログ確認・表示クリア</text><text x="527" y="820">→</text><rect x="540" y="774" width="244" height="82" rx="5"/><text x="548" y="794">対象ログを表示する</text><text x="787" y="820">→</text><rect x="800" y="774" width="244" height="82" rx="5"/><text x="808" y="794">R：実行対象・所有確認・実行状</text><text x="808" y="811">態、R：取得可能なログ・エラー</text><text x="1047" y="820">→</text><rect x="1060" y="774" width="244" height="82" rx="5"/><text x="1068" y="794">上限と省略を示し表示クリアでロ</text><text x="1068" y="811">グファイルを消さない</text><text x="20" y="895">INT-NYANRAD-004-EXPORT [normal]</text><rect x="20" y="906" width="244" height="82" rx="5"/><text x="28" y="926">実行操作・プレビュー・ログ</text><text x="267" y="952">→</text><rect x="280" y="906" width="244" height="82" rx="5"/><text x="288" y="926">通常ソースを取り出す</text><text x="527" y="952">→</text><rect x="540" y="906" width="244" height="82" rx="5"/><text x="548" y="926">通常ソースを利用可能にする</text><text x="787" y="952">→</text><rect x="800" y="906" width="244" height="82" rx="5"/><text x="808" y="926">R：保存結果・通常ソース・実行</text><text x="808" y="943">設定</text><text x="1047" y="952">→</text><rect x="1060" y="906" width="244" height="82" rx="5"/><text x="1068" y="926">対応するNyanQL群でIDE</text><text x="1068" y="943">外利用する通常ファイルを渡す</text></svg>