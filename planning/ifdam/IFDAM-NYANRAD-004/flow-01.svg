<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 90 1400 1400"><style>text{font-family:system-ui,sans-serif;fill:#203047;font-size:14px}rect{stroke:#9aacbd;fill:#f5f8fc}.title{font-size:22px;font-weight:bold}</style><text x="20" y="34" class="title">アプリを実行して動作を確認する — draft</text><text x="20" y="62">画面 → 操作 → 機能 → データ操作 ／ 画面へ返す結果（機能からそれぞれ接続）</text><text x="20" y="103">INT-NYANRAD-004-START [normal]</text><rect x="20" y="114" width="259" height="92" rx="5"/><text x="28" y="133">実行操作・プレビュー・ログ</text><text x="281" y="160">→</text><rect x="295" y="114" width="259" height="92" rx="5"/><text x="303" y="133">実行</text><text x="556" y="160">→</text><rect x="570" y="114" width="259" height="92" rx="5"/><text x="578" y="133">実行条件を確認して対象を起動する</text><text x="831" y="160">→</text><rect x="845" y="114" width="259" height="92" rx="5"/><text x="853" y="133">R：保存結果・通常ソース・実行設</text><text x="853" y="150">定、C/U：実行対象・所有確認・</text><text x="853" y="167">実行状態</text><text x="1106" y="160">／</text><rect x="1120" y="114" width="259" height="92" rx="5"/><text x="1128" y="133">対象ごとの起動結果とプレビュー先</text><text x="1128" y="150">を表示する</text><text x="20" y="243">INT-NYANRAD-004-BLOCK [exception]</text><rect x="20" y="254" width="259" height="92" rx="5"/><text x="28" y="273">実行操作・プレビュー・ログ</text><text x="281" y="300">→</text><rect x="295" y="254" width="259" height="92" rx="5"/><text x="303" y="273">実行</text><text x="556" y="300">→</text><rect x="570" y="254" width="259" height="92" rx="5"/><text x="578" y="273">部分保存での起動を止める</text><text x="831" y="300">→</text><rect x="845" y="254" width="259" height="92" rx="5"/><text x="853" y="273">R：保存結果・通常ソース・実行設</text><text x="853" y="290">定、R：実行対象・所有確認・実行</text><text x="853" y="307">状態</text><text x="1106" y="300">／</text><rect x="1120" y="254" width="259" height="92" rx="5"/><text x="1128" y="273">新規起動せず解消すべき対象を表示</text><text x="1128" y="290">する</text><text x="20" y="383">INT-NYANRAD-004-PARTIAL [exception]</text><rect x="20" y="394" widt