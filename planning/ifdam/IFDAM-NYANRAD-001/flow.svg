<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="892" viewBox="0 0 1320 892"><style>text{font-family:system-ui,sans-serif;fill:#203047;font-size:14px}rect{stroke:#9aacbd;fill:#f5f8fc}.title{font-size:22px;font-weight:bold}</style><text x="20" y="34" class="title">プロジェクトを作成・再開する — draft</text><text x="20" y="62">各行：画面 → 操作 → 機能 → データ操作 → 画面へ返す結果</text><text x="20" y="103">INT-NYANRAD-001-CREATE [normal]</text><rect x="20" y="114" width="244" height="82" rx="5"/><text x="28" y="134">プロジェクト操作</text><text x="267" y="160">→</text><rect x="280" y="114" width="244" height="82" rx="5"/><text x="288" y="134">新規作成</text><text x="527" y="160">→</text><rect x="540" y="114" width="244" height="82" rx="5"/><text x="548" y="134">プロジェクトを作成する</text><text x="787" y="160">→</text><rect x="800" y="114" width="244" height="82" rx="5"/><text x="808" y="134">C：プロジェクト・通常ソース・</text><text x="808" y="151">設定、C：編集中の内容</text><text x="1047" y="160">→</text><rect x="1060" y="114" width="244" height="82" rx="5"/><text x="1068" y="134">作成したプロジェクトを表示する</text><text x="20" y="235">INT-NYANRAD-001-OPEN [normal]</text><rect x="20" y="246" width="244" height="82" rx="5"/><text x="28" y="266">プロジェクト操作</text><text x="267" y="292">→</text><rect x="280" y="246" width="244" height="82" rx="5"/><text x="288" y="266">開く</text><text x="527" y="292">→</text><rect x="540" y="246" width="244" height="82" rx="5"/><text x="548" y="266">プロジェクトを読み込む</text><text x="787" y="292">→</text><rect x="800" y="246" width="244" height="82" rx="5"/><text x="808" y="266">R：プロジェクト・通常ソース・</text><text x="808" y="283">設定、C：編集中の内容</text><text x="1047" y="292">→</text><rect x="1060" y="246" width="244" height="82" rx="5"/><text x="1068" y="266">内容と再編集可能範囲を表示する</text><text x="20" y="367">INT-NYANRAD-001-SAVE [normal]</text><rect x="20" y="378" width="244" height="82" rx="5"/><text x="28" y="398">プロジェクト操作</text><text x="267" y="424">→</text><rect x="280" y="378" width="244" height="82" rx="5"/><text x="288" y="398">保存</text><text x="527" y="424">→</text><rect x="540" y="378" width="244" height="82" rx="5"/><text x="548" y="398">編集内容を保存する</text><text x="787" y="424">→</text><rect x="800" y="378" width="244" height="82" rx="5"/><text x="808" y="398">R/U：プロジェクト・通常ソー</text><text x="808" y="415">ス・設定、R/U：編集中の内容</text><text x="808" y="432">、C：保存結果・競合情報</text><text x="1047" y="424">→</text><rect x="1060" y="378" width="244" height="82" rx="5"/><text x="1068" y="398">対象別の保存結果を表示する</text><text x="20" y="499">INT-NYANRAD-001-CONFLICT [exception]</text><rect x="20" y="510" width="244" height="82" rx="5"/><text x="28" y="530">プロジェクト操作</text><text x="267" y="556">→</text><rect x="280" y="510" width="244" height="82" rx="5"/><text x="288" y="530">保存</text><text x="527" y="556">→</text><rect x="540" y="510" width="244" height="82" rx="5"/><text x="548" y="530">保存競合を確認する</text><text x="787" y="556">→</text><rect x="800" y="510" width="244" height="82" rx="5"/><text x="808" y="530">R：プロジェクト・通常ソース・</text><text x="808" y="547">設定、R：編集中の内容、C：保</text><text x="808" y="564">存結果・競合情報</text><text x="1047" y="556">→</text><rect x="1060" y="510" width="244" height="82" rx="5"/><text x="1068" y="530">差分と再読込・明示上書き・中止</text><text x="1068" y="547">の選択を示す</text><text x="20" y="631">INT-NYANRAD-001-SAVEFAIL [exception]</text><rect x="20" y="642" width="244" height="82" rx="5"/><text x="28" y="662">プロジェクト操作</text><text x="267" y="688">→</text><rect x="280" y="642" width="244" height="82" rx="5"/><text x="288" y="662">保存</text><text x="527" y="688">→</text><rect x="540" y="642" width="244" height="82" rx="5"/><text x="548" y="662">保存失敗を表示する</text><text x="787" y="688">→</text><rect x="800" y="642" width="244" height="82" rx="5"/><text x="808" y="662">R：編集中の内容、C：保存結果</text><text x="808" y="679">・競合情報</text><text x="1047" y="688">→</text><rect x="1060" y="642" width="244" height="82" rx="5"/><text x="1068" y="662">未保存内容と失敗対象を保持して</text><text x="1068" y="679">表示し新規実行を止める</text><text x="20" y="763">INT-NYANRAD-001-EXISTS [exception]</text><rect x="20" y="774" width="244" height="82" rx="5"/><text x="28" y="794">プロジェクト操作</text><text x="267" y="820">→</text><rect x="280" y="774" width="244" height="82" rx="5"/><text x="288" y="794">新規作成</text><text x="527" y="820">→</text><rect x="540" y="774" width="244" height="82" rx="5"/><text x="548" y="794">作成先の既存内容を保護する</text><text x="787" y="820">→</text><rect x="800" y="774" width="244" height="82" rx="5"/><text x="808" y="794">R：プロジェクト・通常ソース・</text><text x="808" y="811">設定</text><text x="1047" y="820">→</text><rect x="1060" y="774" width="244" height="82" rx="5"/><text x="1068" y="794">生成せず別の場所・中止を示す</text></svg>