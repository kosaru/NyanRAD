<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1255" viewBox="0 0 1400 1255"><style>text{font-family:system-ui,sans-serif;fill:#203047;font-size:14px}rect{stroke:#9aacbd;fill:#f5f8fc}.title{font-size:22px;font-weight:bold}</style><text x="20" y="30" class="title">フォームと画面イベントを編集する 2/3 — draft</text><text x="20" y="58">画面 → 操作 → 機能 → データ操作 ／ 結果（条件は確認表を参照）</text><text x="20" y="88">INT-NYANRAD-002-RENAME [normal]</text><rect x="20" y="99" width="259" height="120" rx="5"/><text x="28" y="118">デザイン・プロパティ・コード</text><text x="281" y="153">→</text><rect x="295" y="99" width="259" height="120" rx="5"/><text x="303" y="118">部品名を変更</text><text x="556" y="153">→</text><rect x="570" y="99" width="259" height="120" rx="5"/><text x="578" y="118">管理対象の名前を変更する</text><text x="831" y="153">→</text><rect x="845" y="99" width="259" height="120" rx="5"/><text x="853" y="118">R/U：フォーム・部品・プロパテ</text><text x="853" y="133">ィ、R/U：IDE管理のイベント</text><text x="853" y="148">対応・結線、C/U：編集状態・履</text><text x="853" y="163">歴、R：手書きイベント処理本文</text><text x="1106" y="153">／</text><rect x="1120" y="99" width="259" height="120" rx="5"/><text x="1128" y="118">管理対象を更新し手書き本文への影</text><text x="1128" y="133">響を示す。本文は無条件に文字列置</text><text x="1128" y="148">換しない</text><text x="20" y="253">INT-NYANRAD-002-ROWKEY [normal]</text><rect x="20" y="264" width="259" height="120" rx="5"/><text x="28" y="283">デザイン・プロパティ・コード</text><text x="281" y="318">→</text><rect x="295" y="264" width="259" height="120" rx="5"/><text x="303" y="283">一覧表の行を選ぶ</text><text x="556" y="318">→</text><rect x="570" y="264" width="259" height="120" rx="5"/><text x="578" y="283">行キーと行データを渡す</text><text x="831" y="318">→</text><rect x="845" y="264" width="259" height="120" rx="5"/><text x="853" y="283">R：フォーム・部品・プロパティ、</text><text x="853" y="298">R：IDE管理のイベント対応・結</text><text x="853" y="313">線、R：手書きイベント処理本文</text><text x="1106" y="318">／</text><rect x="1120" y="264" width="259" height="120" rx="5"/><text x="1128" y="283">キーとその時点の行データを渡す</text><text x="20" y="418">INT-NYANRAD-002-ROWINDEX [alternative]</text><rect x="20" y="429" width="259" height="120" rx="5"/><text x="28" y="448">デザイン・プロパティ・コード</text><text x="281" y="483">→</text><rect x="295" y="429" width="259" height="120" rx="5"/><text x="303" y="448">一覧表の行を選ぶ</text><text x="556" y="483">→</text><rect x="570" y="429" width="259" height="120" rx="5"/><text x="578" y="448">行番号と行データを渡す</text><text x="831" y="483">→</text><rect x="845" y="429" width="259" height="120" rx="5"/><text x="853" y="448">R：フォーム・部品・プロパティ、</text><text x="853" y="463">R：IDE管理のイベント対応・結</text><text x="853" y="478">線、R：手書きイベント処理本文</text><text x="1106" y="483">／</text><rect x="1120" y="429" width="259" height="120" rx="5"/><text x="1128" y="448">その時点の行番号であると示し行デ</text><text x="1128" y="463">ータを渡す</text><text x="20" y="583">INT-NYANRAD-002-ROWDUP [exception]</text><rect x="20" y="594" width="259" height="120" rx="5"/><text x="28" y="613">デザイン・プロパティ・コード</text><text x="281" y="648">→</text><rect x="295" y="594" width="259" height="120" rx="5"/><text x="303" y="613">一覧表の行を選ぶ</text><text x="556" y="648">→</text><rect x="570" y="594" width="259" height="120" rx="5"/><text x="578" y="613">曖昧な行キーを拒否する</text><text x="831" y="648">→</text><rect x="845" y="594" width="259" height="120" rx="5"/><text x="853" y="613">R：フォーム・部品・プロパティ</text><text x="1106" y="648">／</text><rect x="1120" y="594" width="259" height="120" rx="5"/><text x="1128" y="613">問題を示し曖昧な結果を渡さない</text><text x="20" y="748">INT-NYANRAD-002-ROWRELOAD [normal]</text><rect x="20" y="759" width="259" height="120" rx="5"/><text x="28" y="778">デザイン・プロパティ・コード</text><text x="281" y="813">→</text><rect x="295" y="759" width="259" height="120" rx="5"/><text x="303" y="778">一覧表を再読込</text><text x="556" y="813">→</text><rect x="570" y="759" width="259" height="120" rx="5"/><text x="578" y="778">再読込時の行選択を解除する</text><text x="831" y="813">→</text><rect x="845" y="759" width="259" height="120" rx="5"/><text x="853" y="778">R/U：フォーム・部品・プロパテ</text><text x="853" y="793">ィ</text><text x="1106" y="813">／</text><rect x="1120" y="759" width="259" height="120" rx="5"/><text x="1128" y="778">更新前の行選択を解除する</text><text x="20" y="913">INT-NYANRAD-002-CLIP [alternative]</text><rect x="20" y="924" width="259" height="120" rx="5"/><text x="28" y="943">デザイン・プロパティ・コード</text><text x="281" y="978">→</text><rect x="295" y="924" width="259" height="120" rx="5"/><text x="303" y="943">フォーム外にはみ出す</text><text x="556" y="978">→</text><rect x="570" y="924" width="259" height="120" rx="5"/><text x="578" y="943">はみ出した部品を警告する</text><text x="831" y="978">→</text><rect x="845" y="924" width="259" height="120" rx="5"/><text x="853" y="943">R/U：フォーム・部品・プロパテ</text><text x="853" y="958">ィ、C/U：編集状態・履歴</text><text x="1106" y="978">／</text><rect x="1120" y="924" width="259" height="120" rx="5"/><text x="1128" y="943">警告し部品を自動移動・縮小・削除</text><text x="1128" y="958">しない</text><text x="20" y="1078">INT-NYANRAD-002-UNDODELETE [normal]</text><rect x="20" y="1089" width="259" height="120" rx="5"/><text x="28" y="1108">デザイン・プロパティ・コード</text><text x="281" y="1143">→</text><rect x="295" y="1089" width="259" height="120" rx="5"/><text x="303" y="1108">部品削除を元に戻す</text><text x="556" y="1143">→</text><rect x="570" y="1089" width="259" height="120" rx="5"/><text x="578" y="1108">削除した部品と結線を戻す</text><text x="831" y="1143">→</text><rect x="845" y="1089" width="259" height="120" rx="5"/><text x="853" y="1108">R/C：フォーム・部品・プロパテ</text><text x="853" y="1123">ィ、R/U：IDE管理のイベント</text><text x="853" y="1138">対応・結線、R/U：編集状態・履</text><text x="853" y="1153">歴、R：手書きイベント処理本文</text><text x="1106" y="1143">／</text><rect x="1120" y="1089" width="259" height="120" rx="5"/><text x="1128" y="1108">部品と管理結線を戻し残る手書き本</text><text x="1128" y="1123">文を二重生成しない</text></svg>