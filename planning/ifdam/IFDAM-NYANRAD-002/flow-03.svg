<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1255" viewBox="0 0 1400 1255"><style>text{font-family:system-ui,sans-serif;fill:#203047;font-size:14px}rect{stroke:#9aacbd;fill:#f5f8fc}.title{font-size:22px;font-weight:bold}</style><text x="20" y="30" class="title">フォームと画面イベントを編集する 3/3 — draft</text><text x="20" y="58">画面 → 操作 → 機能 → データ操作 ／ 結果（条件は確認表を参照）</text><text x="20" y="88">INT-NYANRAD-002-UNDOAFTERSAVE [alternative]</text><rect x="20" y="99" width="259" height="120" rx="5"/><text x="28" y="118">デザイン・プロパティ・コード</text><text x="281" y="153">→</text><rect x="295" y="99" width="259" height="120" rx="5"/><text x="303" y="118">保存後にUndo</text><text x="556" y="153">→</text><rect x="570" y="99" width="259" height="120" rx="5"/><text x="578" y="118">保存後の編集を元に戻す</text><text x="831" y="153">→</text><rect x="845" y="99" width="259" height="120" rx="5"/><text x="853" y="118">R/U：フォーム・部品・プロパテ</text><text x="853" y="133">ィ、R/U：編集状態・履歴</text><text x="1106" y="153">／</text><rect x="1120" y="99" width="259" height="120" rx="5"/><text x="1128" y="118">編集内容を戻して未保存と示し保存</text><text x="1128" y="133">済みファイルを巻き戻さない</text><text x="20" y="253">INT-NYANRAD-002-ALIGN [normal]</text><rect x="20" y="264" width="259" height="120" rx="5"/><text x="28" y="283">デザイン・プロパティ・コード</text><text x="281" y="318">→</text><rect x="295" y="264" width="259" height="120" rx="5"/><text x="303" y="283">部品を整列</text><text x="556" y="318">→</text><rect x="570" y="264" width="259" height="120" rx="5"/><text x="578" y="283">選択部品を整列する</text><text x="831" y="318">→</text><rect x="845" y="264" width="259" height="120" rx="5"/><text x="853" y="283">R/U：フォーム・部品・プロパテ</text><text x="853" y="298">ィ、C/U：編集状態・履歴</text><text x="1106" y="318">／</text><rect x="1120" y="264" width="259" height="120" rx="5"/><text x="1128" y="283">配置を反映しUndo対象とする</text><text x="20" y="418">INT-NYANRAD-002-FORMADD [normal]</text><rect x="20" y="429" width="259" height="120" rx="5"/><text x="28" y="448">デザイン・プロパティ・コード</text><text x="281" y="483">→</text><rect x="295" y="429" width="259" height="120" rx="5"/><text x="303" y="448">フォームを追加</text><text x="556" y="483">→</text><rect x="570" y="429" width="259" height="120" rx="5"/><text x="578" y="448">フォームを追加する</text><text x="831" y="483">→</text><rect x="845" y="429" width="259" height="120" rx="5"/><text x="853" y="448">R/C：フォーム・部品・プロパテ</text><text x="853" y="463">ィ、C/U：編集状態・履歴</text><text x="1106" y="483">／</text><rect x="1120" y="429" width="259" height="120" rx="5"/><text x="1128" y="448">フォームを追加し一覧に表示する</text><text x="20" y="583">INT-NYANRAD-002-FORMSWITCH [normal]</text><rect x="20" y="594" width="259" height="120" rx="5"/><text x="28" y="613">デザイン・プロパティ・コード</text><text x="281" y="648">→</text><rect x="295" y="594" width="259" height="120" rx="5"/><text x="303" y="613">フォームを切り替える</text><text x="556" y="648">→</text><rect x="570" y="594" width="259" height="120" rx="5"/><text x="578" y="613">選択したフォームを表示する</text><text x="831" y="648">→</text><rect x="845" y="594" width="259" height="120" rx="5"/><text x="853" y="613">R：フォーム・部品・プロパティ、</text><text x="853" y="628">R/U：編集状態・履歴</text><text x="1106" y="648">／</text><rect x="1120" y="594" width="259" height="120" rx="5"/><text x="1128" y="613">選択したフォームを表示する</text><text x="20" y="748">INT-NYANRAD-002-CODEEDIT [normal]</text><rect x="20" y="759" width="259" height="120" rx="5"/><text x="28" y="778">デザイン・プロパティ・コード</text><text x="281" y="813">→</text><rect x="295" y="759" width="259" height="120" rx="5"/><text x="303" y="778">イベント処理本文を編集</text><text x="556" y="813">→</text><rect x="570" y="759" width="259" height="120" rx="5"/><text x="578" y="778">手書き本文を編集する</text><text x="831" y="813">→</text><rect x="845" y="759" width="259" height="120" rx="5"/><text x="853" y="778">R：IDE管理のイベント対応・結</text><text x="853" y="793">線、R/U：手書きイベント処理本</text><text x="853" y="808">文、C/U：編集状態・履歴</text><text x="1106" y="813">／</text><rect x="1120" y="759" width="259" height="120" rx="5"/><text x="1128" y="778">編集中の本文と未保存状態を表示す</text><text x="1128" y="793">る</text><text x="20" y="913">INT-NYANRAD-002-FORMLOAD [normal]</text><rect x="20" y="924" width="259" height="120" rx="5"/><text x="28" y="943">生成アプリの画面</text><text x="281" y="978">→</text><rect x="295" y="924" width="259" height="120" rx="5"/><text x="303" y="943">フォームを表示</text><text x="556" y="978">→</text><rect x="570" y="924" width="259" height="120" rx="5"/><text x="578" y="943">フォームLoadを呼び出す</text><text x="831" y="978">→</text><rect x="845" y="924" width="259" height="120" rx="5"/><text x="853" y="943">R：IDE管理のイベント対応・結</text><text x="853" y="958">線、R：手書きイベント処理本文</text><text x="1106" y="978">／</text><rect x="1120" y="924" width="259" height="120" rx="5"/><text x="1128" y="943">フォームLoadを一度呼び出す</text><text x="20" y="1078">INT-NYANRAD-002-EVENTARGS [normal]</text><rect x="20" y="1089" width="259" height="120" rx="5"/><text x="28" y="1108">生成アプリの画面</text><text x="281" y="1143">→</text><rect x="295" y="1089" width="259" height="120" rx="5"/><text x="303" y="1108">フォーム・部品のイベント発生</text><text x="556" y="1143">→</text><rect x="570" y="1089" width="259" height="120" rx="5"/><text x="578" y="1108">イベント引数を処理へ渡す</text><text x="831" y="1143">→</text><rect x="845" y="1089" width="259" height="120" rx="5"/><text x="853" y="1108">R：IDE管理のイベント対応・結</text><text x="853" y="1123">線、R：手書きイベント処理本文</text><text x="1106" y="1143">／</text><rect x="1120" y="1089" width="259" height="120" rx="5"/><text x="1128" y="1108">対象・現在値・ブラウザイベント等</text><text x="1128" y="1123">を実行場所に応じ明示的な引数で渡</text><text x="1128" y="1138">す</text></svg>