<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="892" viewBox="0 0 1320 892"><style>text{font-family:system-ui,sans-serif;fill:#203047;font-size:14px}rect{stroke:#9aacbd;fill:#f5f8fc}.title{font-size:22px;font-weight:bold}</style><text x="20" y="34" class="title">フォームと画面イベントを編集する — draft</text><text x="20" y="62">各行：画面 → 操作 → 機能 → データ操作 → 画面へ返す結果</text><text x="20" y="103">INT-NYANRAD-002-EDIT [normal]</text><rect x="20" y="114" width="244" height="82" rx="5"/><text x="28" y="134">デザイン・プロパティ・コード</text><text x="267" y="160">→</text><rect x="280" y="114" width="244" height="82" rx="5"/><text x="288" y="134">配置・プロパティ変更</text><text x="527" y="160">→</text><rect x="540" y="114" width="244" height="82" rx="5"/><text x="548" y="134">フォームと部品を編集する</text><text x="787" y="160">→</text><rect x="800" y="114" width="244" height="82" rx="5"/><text x="808" y="134">R/C/U：フォーム・部品・プ</text><text x="808" y="151">ロパティ、C/U：編集状態・履</text><text x="808" y="168">歴</text><text x="1047" y="160">→</text><rect x="1060" y="114" width="244" height="82" rx="5"/><text x="1068" y="134">変更と未保存状態を表示する</text><text x="20" y="235">INT-NYANRAD-002-EVENT [normal]</text><rect x="20" y="246" width="244" height="82" rx="5"/><text x="28" y="266">デザイン・プロパティ・コード</text><text x="267" y="292">→</text><rect x="280" y="246" width="244" height="82" rx="5"/><text x="288" y="266">イベント選択</text><text x="527" y="292">→</text><rect x="540" y="246" width="244" height="82" rx="5"/><text x="548" y="266">イベント処理を開く</text><text x="787" y="292">→</text><rect x="800" y="246" width="244" height="82" rx="5"/><text x="808" y="266">R：イベント対応・手書き本文、</text><text x="808" y="283">C/U：編集状態・履歴</text><text x="1047" y="292">→</text><rect x="1060" y="246" width="244" height="82" rx="5"/><text x="1068" y="266">既存本文または初回の雛形を開く</text><text x="20" y="367">INT-NYANRAD-002-DELETE [normal]</text><rect x="20" y="378" width="244" height="82" rx="5"/><text x="28" y="398">デザイン・プロパティ・コード</text><text x="267" y="424">→</text><rect x="280" y="378" width="244" height="82" rx="5"/><text x="288" y="398">部品削除</text><text x="527" y="424">→</text><rect x="540" y="378" width="244" height="82" rx="5"/><text x="548" y="398">部品と管理結線を削除する</text><text x="787" y="424">→</text><rect x="800" y="378" width="244" height="82" rx="5"/><text x="808" y="398">R/D：フォーム・部品・プロパ</text><text x="808" y="415">ティ、R/U：イベント対応・手</text><text x="808" y="432">書き本文、C/U：編集状態・履</text><text x="808" y="449">歴</text><text x="1047" y="424">→</text><rect x="1060" y="378" width="244" height="82" rx="5"/><text x="1068" y="398">部品を削除し手書き本文を保持す</text><text x="1068" y="415">る</text><text x="20" y="499">INT-NYANRAD-002-UNDO [normal]</text><rect x="20" y="510" width="244" height="82" rx="5"/><text x="28" y="530">デザイン・プロパティ・コード</text><text x="267" y="556">→</text><rect x="280" y="510" width="244" height="82" rx="5"/><text x="288" y="530">Undo・Redo</text><text x="527" y="556">→</text><rect x="540" y="510" width="244" height="82" rx="5"/><text x="548" y="530">配置等の編集を戻す・再適用する</text><text x="787" y="556">→</text><rect x="800" y="510" width="244" height="82" rx="5"/><text x="808" y="530">R/U：フォーム・部品・プロパ</text><text x="808" y="547">ティ、R/U：イベント対応・手</text><text x="808" y="564">書き本文、R/U：編集状態・履</text><text x="808" y="581">歴</text><text x="1047" y="556">→</text><rect x="1060" y="510" width="244" height="82" rx="5"/><text x="1068" y="530">編集状態を更新し保存済みファイ</text><text x="1068" y="547">ルは自動巻戻ししない</text><text x="20" y="631">INT-NYANRAD-002-INVALID [exception]</text><rect x="20" y="642" width="244" height="82" rx="5"/><text x="28" y="662">デザイン・プロパティ・コード</text><text x="267" y="688">→</text><rect x="280" y="642" width="244" height="82" rx="5"/><text x="288" y="662">名前・配置値変更</text><text x="527" y="688">→</text><rect x="540" y="642" width="244" height="82" rx="5"/><text x="548" y="662">不正な変更を拒否する</text><text x="787" y="688">→</text><rect x="800" y="642" width="244" height="82" rx="5"/><text x="808" y="662">R：フォーム・部品・プロパティ</text><text x="808" y="679">、R：編集状態・履歴</text><text x="1047" y="688">→</text><rect x="1060" y="642" width="244" height="82" rx="5"/><text x="1068" y="662">以前の値を保持し理由を表示する</text><text x="20" y="763">INT-NYANRAD-002-UNSUPPORTED [alternative]</text><rect x="20" y="774" width="244" height="82" rx="5"/><text x="28" y="794">デザイン・プロパティ・コード</text><text x="267" y="820">→</text><rect x="280" y="774" width="244" height="82" rx="5"/><text x="288" y="794">ソース再読込</text><text x="527" y="820">→</text><rect x="540" y="774" width="244" height="82" rx="5"/><text x="548" y="794">再編集範囲を示す</text><text x="787" y="820">→</text><rect x="800" y="774" width="244" height="82" rx="5"/><text x="808" y="794">R：フォーム・部品・プロパティ</text><text x="808" y="811">、R：イベント対応・手書き本文</text><text x="808" y="828">、C/U：編集状態・履歴</text><text x="1047" y="820">→</text><rect x="1060" y="774" width="244" height="82" rx="5"/><text x="1068" y="794">ソースを保持し編集制限の範囲と</text><text x="1068" y="811">理由を示す</text></svg>