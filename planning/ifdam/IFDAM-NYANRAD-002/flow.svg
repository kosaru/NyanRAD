<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1780" viewBox="0 0 1400 1780"><style>text{font-family:system-ui,sans-serif;fill:#203047;font-size:14px}rect{stroke:#9aacbd;fill:#f5f8fc}.title{font-size:22px;font-weight:bold}</style><text x="20" y="34" class="title">フォームと画面イベントを編集する — draft</text><text x="20" y="62">各行：画面 → 操作 → 機能 → データ操作 → 画面へ返す結果</text><text x="20" y="103">INT-NYANRAD-002-EDIT [normal]</text><rect x="20" y="114" width="259" height="92" rx="5"/><text x="28" y="133">デザイン・プロパティ・コード</text><text x="281" y="160">→</text><rect x="295" y="114" width="259" height="92" rx="5"/><text x="303" y="133">配置・プロパティ変更</text><text x="556" y="160">→</text><rect x="570" y="114" width="259" height="92" rx="5"/><text x="578" y="133">フォームと部品を編集する</text><text x="831" y="160">→</text><rect x="845" y="114" width="259" height="92" rx="5"/><text x="853" y="133">R/C/U：フォーム・部品・プロ</text><text x="853" y="150">パティ、C/U：編集状態・履歴</text><text x="1106" y="160">→</text><rect x="1120" y="114" width="259" height="92" rx="5"/><text x="1128" y="133">変更と未保存状態を表示する</text><text x="20" y="243">INT-NYANRAD-002-EVENT [normal]</text><rect x="20" y="254" width="259" height="92" rx="5"/><text x="28" y="273">デザイン・プロパティ・コード</text><text x="281" y="300">→</text><rect x="295" y="254" width="259" height="92" rx="5"/><text x="303" y="273">イベント選択</text><text x="556" y="300">→</text><rect x="570" y="254" width="259" height="92" rx="5"/><text x="578" y="273">イベント処理を開く</text><text x="831" y="300">→</text><rect x="845" y="254" width="259" height="92" rx="5"/><text x="853" y="273">R：イベント対応・手書き本文、C</text><text x="853" y="290">/U：編集状態・履歴</text><text x="1106" y="300">→</text><rect x="1120" y="254" width="259" height="92" rx="5"/><text x="1128" y="273">既存本文または初回の雛形を開く</text><text x="20" y="383">INT-NYANRAD-002-DELETE [normal]</text><rect x="20" y="394" width="259" height="92" rx="5"/><text x="28" y="413">デザイン・プロパティ・コード</text><text x="281" y="440">→</text><rect x="295" y="394" width="259" height="92" rx="5"/><text x="303" y="413">部品削除</text><text x="556" y="440">→</text><rect x="570" y="394" width="259" height="92" rx="5"/><text x="578" y="413">部品と管理結線を削除する</text><text x="831" y="440">→</text><rect x="845" y="394" width="259" height="92" rx="5"/><text x="853" y="413">R/D：フォーム・部品・プロパテ</text><text x="853" y="430">ィ、R/U：イベント対応・手書き</text><text x="853" y="447">本文、C/U：編集状態・履歴</text><text x="1106" y="440">→</text><rect x="1120" y="394" width="259" height="92" rx="5"/><text x="1128" y="413">部品を削除し手書き本文を保持する</text><text x="20" y="523">INT-NYANRAD-002-UNDO [normal]</text><rect x="20" y="534" width="259" height="92" rx="5"/><text x="28" y="553">デザイン・プロパティ・コード</text><text x="281" y="580">→</text><rect x="295" y="534" width="259" height="92" rx="5"/><text x="303" y="553">Undo・Redo</text><text x="556" y="580">→</text><rect x="570" y="534" width="259" height="92" rx="5"/><text x="578" y="553">配置等の編集を戻す・再適用する</text><text x="831" y="580">→</text><rect x="845" y="534" width="259" height="92" rx="5"/><text x="853" y="553">R/U：フォーム・部品・プロパテ</text><text x="853" y="570">ィ、R/U：イベント対応・手書き</text><text x="853" y="587">本文、R/U：編集状態・履歴</text><text x="1106" y="580">→</text><rect x="1120" y="534" width="259" height="92" rx="5"/><text x="1128" y="553">編集状態を更新し保存済みファイル</text><text x="1128" y="570">は自動巻戻ししない</text><text x="20" y="663">INT-NYANRAD-002-INVALID [exception]</text><rect x="20" y="674" width="259" height="92" rx="5"/><text x="28" y="693">デザイン・プロパティ・コード</text><text x="281" y="720">→</text><rect x="295" y="674" width="259" height="92" rx="5"/><text x="303" y="693">名前・配置値変更</text><text x="556" y="720">→</text><rect x="570" y="674" width="259" height="92" rx="5"/><text x="578" y="693">不正な変更を拒否する</text><text x="831" y="720">→</text><rect x="845" y="674" width="259" height="92" rx="5"/><text x="853" y="693">R：フォーム・部品・プロパティ、</text><text x="853" y="710">R：編集状態・履歴</text><text x="1106" y="720">→</text><rect x="1120" y="674" width="259" height="92" rx="5"/><text x="1128" y="693">以前の値を保持し理由を表示する</text><text x="20" y="803">INT-NYANRAD-002-UNSUPPORTED [alternative]</text><rect x="20" y="814" width="259" height="92" rx="5"/><text x="28" y="833">デザイン・プロパティ・コード</text><text x="281" y="860">→</text><rect x="295" y="814" width="259" height="92" rx="5"/><text x="303" y="833">ソース再読込</text><text x="556" y="860">→</text><rect x="570" y="814" width="259" height="92" rx="5"/><text x="578" y="833">再編集範囲を示す</text><text x="831" y="860">→</text><rect x="845" y="814" width="259" height="92" rx="5"/><text x="853" y="833">R：フォーム・部品・プロパティ、</text><text x="853" y="850">R：イベント対応・手書き本文、C</text><text x="853" y="867">/U：編集状態・履歴</text><text x="1106" y="860">→</text><rect x="1120" y="814" width="259" height="92" rx="5"/><text x="1128" y="833">ソースを保持し編集制限の範囲と理</text><text x="1128" y="850">由を示す</text><text x="20" y="943">INT-NYANRAD-002-COPY [normal]</text><rect x="20" y="954" width="259" height="92" rx="5"/><text x="28" y="973">デザイン・プロパティ・コード</text><text x="281" y="1000">→</text><rect x="295" y="954" width="259" height="92" rx="5"/><text x="303" y="973">部品をコピー</text><text x="556" y="1000">→</text><rect x="570" y="954" width="259" height="92" rx="5"/><text x="578" y="973">部品を複製する</text><text x="831" y="1000">→</text><rect x="845" y="954" width="259" height="92" rx="5"/><text x="853" y="973">R/C：フォーム・部品・プロパテ</text><text x="853" y="990">ィ、R：イベント対応・手書き本文</text><text x="853" y="1007">、C/U：編集状態・履歴</text><text x="1106" y="1000">→</text><rect x="1120" y="954" width="259" height="92" rx="5"/><text x="1128" y="973">新しい名前で部品を複製し手書き処</text><text x="1128" y="990">理本文を自動複製しない</text><text x="20" y="1083">INT-NYANRAD-002-RENAME [normal]</text><rect x="20" y="1094" width="259" height="92" rx="5"/><text x="28" y="1113">デザイン・プロパティ・コード</text><text x="281" y="1140">→</text><rect x="295" y="1094" width="259" height="92" rx="5"/><text x="303" y="1113">部品名を変更</text><text x="556" y="1140">→</text><rect x="570" y="1094" width="259" height="92" rx="5"/><text x="578" y="1113">管理対象の名前を変更する</text><text x="831" y="1140">→</text><rect x="845" y="1094" width="259" height="92" rx="5"/><text x="853" y="1113">R/U：フォーム・部品・プロパテ</text><text x="853" y="1130">ィ、R/U：イベント対応・手書き</text><text x="853" y="1147">本文、C/U：編集状態・履歴</text><text x="1106" y="1140">→</text><rect x="1120" y="1094" width="259" height="92" rx="5"/><text x="1128" y="1113">管理対象の対応を更新し手書き本文</text><text x="1128" y="1130">を無条件に文字列置換しない</text><text x="20" y="1223">INT-NYANRAD-002-ROWKEY [normal]</text><rect x="20" y="1234" width="259" height="92" rx="5"/><text x="28" y="1253">デザイン・プロパティ・コード</text><text x="281" y="1280">→</text><rect x="295" y="1234" width="259" height="92" rx="5"/><text x="303" y="1253">一覧表の行を選ぶ</text><text x="556" y="1280">→</text><rect x="570" y="1234" width="259" height="92" rx="5"/><text x="578" y="1253">行キーと行データを渡す</text><text x="831" y="1280">→</text><rect x="845" y="1234" width="259" height="92" rx="5"/><text x="853" y="1253">R：フォーム・部品・プロパティ、</text><text x="853" y="1270">R：イベント対応・手書き本文</text><text x="1106" y="1280">→</text><rect x="1120" y="1234" width="259" height="92" rx="5"/><text x="1128" y="1253">キーとその時点の行データを渡す</text><text x="20" y="1363">INT-NYANRAD-002-ROWINDEX [alternative]</text><rect x="20" y="1374" width="259" height="92" rx="5"/><text x="28" y="1393">デザイン・プロパティ・コード</text><text x="281" y="1420">→</text><rect x="295" y="1374" width="259" height="92" rx="5"/><text x="303" y="1393">一覧表の行を選ぶ</text><text x="556" y="1420">→</text><rect x="570" y="1374" width="259" height="92" rx="5"/><text x="578" y="1393">行番号と行データを渡す</text><text x="831" y="1420">→</text><rect x="845" y="1374" width="259" height="92" rx="5"/><text x="853" y="1393">R：フォーム・部品・プロパティ、</text><text x="853" y="1410">R：イベント対応・手書き本文</text><text x="1106" y="1420">→</text><rect x="1120" y="1374" width="259" height="92" rx="5"/><text x="1128" y="1393">その時点の行番号であると示し行デ</text><text x="1128" y="1410">ータを渡す</text><text x="20" y="1503">INT-NYANRAD-002-ROWDUP [exception]</text><rect x="20" y="1514" width="259" height="92" rx="5"/><text x="28" y="1533">デザイン・プロパティ・コード</text><text x="281" y="1560">→</text><rect x="295" y="1514" width="259" height="92" rx="5"/><text x="303" y="1533">一覧表の行を選ぶ</text><text x="556" y="1560">→</text><rect x="570" y="1514" width="259" height="92" rx="5"/><text x="578" y="1533">曖昧な行キーを拒否する</text><text x="831" y="1560">→</text><rect x="845" y="1514" width="259" height="92" rx="5"/><text x="853" y="1533">R：フォーム・部品・プロパティ</text><text x="1106" y="1560">→</text><rect x="1120" y="1514" width="259" height="92" rx="5"/><text x="1128" y="1533">問題を示し曖昧な結果を渡さない</text><text x="20" y="1643">INT-NYANRAD-002-ROWRELOAD [normal]</text><rect x="20" y="1654" width="259" height="92" rx="5"/><text x="28" y="1673">デザイン・プロパティ・コード</text><text x="281" y="1700">→</text><rect x="295" y="1654" width="259" height="92" rx="5"/><text x="303" y="1673">一覧表を再読込</text><text x="556" y="1700">→</text><rect x="570" y="1654" width="259" height="92" rx="5"/><text x="578" y="1673">再読込時の行選択を解除する</text><text x="831" y="1700">→</text><rect x="845" y="1654" width="259" height="92" rx="5"/><text x="853" y="1673">R/U：フォーム・部品・プロパテ</text><text x="853" y="1690">ィ</text><text x="1106" y="1700">→</text><rect x="1120" y="1654" width="259" height="92" rx="5"/><text x="1128" y="1673">更新前の行選択を解除する</text></svg>