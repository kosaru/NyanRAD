<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="3565" viewBox="0 0 1400 3565"><style>text{font-family:system-ui,sans-serif;fill:#203047;font-size:14px}rect{stroke:#9aacbd;fill:#f5f8fc}.title{font-size:22px;font-weight:bold}</style><text x="20" y="30" class="title">フォームと画面イベントを編集する — draft</text><text x="20" y="58">画面 → 操作 → 機能 → データ操作 ／ 結果（条件は確認表を参照）</text><text x="20" y="88">INT-NYANRAD-002-EDIT [normal]</text><rect x="20" y="99" width="259" height="120" rx="5"/><text x="28" y="118">デザイン・プロパティ・コード</text><text x="281" y="153">→</text><rect x="295" y="99" width="259" height="120" rx="5"/><text x="303" y="118">配置・プロパティ変更</text><text x="556" y="153">→</text><rect x="570" y="99" width="259" height="120" rx="5"/><text x="578" y="118">フォームと部品を編集する</text><text x="831" y="153">→</text><rect x="845" y="99" width="259" height="120" rx="5"/><text x="853" y="118">R/C/U：フォーム・部品・プロ</text><text x="853" y="133">パティ、C/U：編集状態・履歴</text><text x="1106" y="153">／</text><rect x="1120" y="99" width="259" height="120" rx="5"/><text x="1128" y="118">変更と未保存状態を表示する</text><text x="20" y="253">INT-NYANRAD-002-EVENT [normal]</text><rect x="20" y="264" width="259" height="120" rx="5"/><text x="28" y="283">デザイン・プロパティ・コード</text><text x="281" y="318">→</text><rect x="295" y="264" width="259" height="120" rx="5"/><text x="303" y="283">イベント選択</text><text x="556" y="318">→</text><rect x="570" y="264" width="259" height="120" rx="5"/><text x="578" y="283">イベント処理を開く</text><text x="831" y="318">→</text><rect x="845" y="264" width="259" height="120" rx="5"/><text x="853" y="283">R：IDE管理のイベント対応・結</text><text x="853" y="298">線、C/U：編集状態・履歴、R：</text><text x="853" y="313">手書きイベント処理本文</text><text x="1106" y="318">／</text><rect x="1120" y="264" width="259" height="120" rx="5"/><text x="1128" y="283">既存本文または初回の雛形を開く</text><text x="20" y="418">INT-NYANRAD-002-DELETE [normal]</text><rect x="20" y="429" width="259" height="120" rx="5"/><text x="28" y="448">デザイン・プロパティ・コード</text><text x="281" y="483">→</tex