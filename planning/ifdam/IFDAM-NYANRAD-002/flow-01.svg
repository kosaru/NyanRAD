>管理対象の名前を変更する</text><text x="831" y="1140">→</text><rect x="845" y="1094" width="259" height="92" rx="5"/><text x="853" y="1113">R/U：フォーム・部品・プロパテ</text><text x="853" y="1130">ィ、R/U：イベント対応・手書き</text><text x="853" y="1147">本文、C/U：編集状態・履歴</text><text x="1106" y="1140">／</text><rect x="1120" y="1094" width="259" height="92" rx="5"/><text x="1128" y="1113">管理対象を更新し手書き本文への影</text><text x="1128" y="1130">響を示す。本文は無条件に文字列置</text><text x="1128" y="1147">換しない</text><text x="20" y="1223">INT-NYANRAD-002-ROWKEY [normal]</text><rect x="20" y="1234" width="259" height="92" rx="5"/><text x="28" y="1253">デザイン・プロパティ・コード</text><text x="281" y="1280">→</text><rect x="295" y="1234" width="259" height="92" rx="5"/><text x="303" y="1253">一覧表の行を選ぶ</text><text x="556" y="1280">→</text><rect x="570" y="1234" width="259" height="92" rx="5"/><text x="578" y="1253">行キーと行データを渡す</text><text x="831" y="1280">→</text><rect x="845" y="1234" width="259" height="92" rx="5"/><text x="853" y="1253">R：フォーム・部品・プロパティ、</text><text x="853" y="1270">R：イベント対応・手書き本文</text><text x="1106" y="1280">／</text><rect x="1120" y="1234" width="259" height="92" rx="5"/><text x="1128" y="1253">キーとその時点の行データを渡す</text><text x="20" y="1363">INT-NYANRAD-002-ROWINDEX [alternative]</text><rect x="20" y="1374" width="259" height="92" rx="5"/><text x="28" y="1393">デザイン・プロパティ・コード</text><text x="281" y="1420">→</text><rect x="295" y="1374" width="259" height="92" rx="5"/><text x="303" y="1393">一覧表の行を選ぶ</text><text x="556" y="1420">→</text><rect x="570" y="1374" width="259" height="92" rx="5"/><text x="578" y="1393">行番号と行データを渡す</text><text x="831" y="1420">→</text><rect x="845" y="1374" width="259" height="92" rx="5"/><text x="853" y="1393">R：フォーム・部品・プロパティ、</text><text x="853" y="1410">R：イベント対応・手書き本文</text><text x="1106" y="1420">／</text><rect x="1120" y="1374" width="259" height="92" rx="5"/><text x="1128" y="1393">その時点の行番号であると示し行デ</text><text x="1128" y="1410">ータを渡す</text><text x="20" y="1503">INT-NYANRAD-002-ROWDUP [exception]</tex