<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 90 1400 1400"><style>text{font-family:system-ui,sans-serif;fill:#203047;font-size:14px}rect{stroke:#9aacbd;fill:#f5f8fc}.title{font-size:22px;font-weight:bold}</style><text x="20" y="34" class="title">フォームと画面イベントを編集する — draft</text><text x="20" y="62">画面 → 操作 → 機能 → データ操作 ／ 画面へ返す結果（機能からそれぞれ接続）</text><text x="20" y="103">INT-NYANRAD-002-EDIT [normal]</text><rect x="20" y="114" width="259" height="92" rx="5"/><text x="28" y="133">デザイン・プロパティ・コード</text><text x="281" y="160">→</text><rect x="295" y="114" width="259" height="92" rx="5"/><text x="303" y="133">配置・プロパティ変更</text><text x="556" y="160">→</text><rect x="570" y="114" width="259" height="92" rx="5"/><text x="578" y="133">フォームと部品を編集する</text><text x="831" y="160">→</text><rect x="845" y="114" width="259" height="92" rx="5"/><text x="853" y="133">R/C/U：フォーム・部品・プロ</text><text x="853" y="150">パティ、C/U：編集状態・履歴</text><text x="1106" y="160">／</text><rect x="1120" y="114" width="259" height="92" rx="5"/><text x="1128" y="133">変更と未保存状態を表示する</text><text x="20" y="243">INT-NYANRAD-002-EVENT [normal]</text><rect x="20" y="254" width="259" height="92" rx="5"/><text x="28" y="273">デザイン・プロパティ・コード</text><text x="281" y="300">→</text><rect x="295" y="254" width="259" height="92" rx="5"/><text x="303" y="273">イベント選択</text><text x="556" y="300">→</text><rect x="570" y="254" width="259" height="92" rx="5"/><text x="578" y="273">イベント処理を開く</text><text x="831" y="300">→</text><rect x="845" y="254" width="259" height="92" rx="5"/><text x="853" y="273">R：イベント対応・手書き本文、C</text><text x="853" y="290">/U：編集状態・履歴</text><text x="1106" y="300">／</text><rect x="1120" y="254" width="259" height="92" rx="5"/><text x="1128" y="273">既存本文または初回の雛形を開く</text><text x="20" y="383">INT-NYANRAD-002-DELETE [normal]</text><rect x="20" y="394" width="259" height="92" rx="5"/><text x="28" y="413">デザイン・プロパティ・コード</text><text x="281" y="440">→</text><rect x="295" y="394" width="259" height="92" rx="5"/><text x="303" y="413">部品削除</text><text x="556" y="440">→</text><rect x="570" y="394" width="259" height="92" rx="5"/><text x="578" y="413">部品と管理結線を削除する</text><text x="831" y="440">→</text><rect x="845" y="394" width="259" height="92" rx="5"/><text x="853" y="413">R/D：フォーム・部品・プロパテ</text><text x="853" y="430">ィ、R/U：イベント対応・手書き</text><text x="853" y="447">本文、C/U：編集状態・履歴</text><text x="1106" y="440">／</text><rect x="1120" y="394" width="259" height="92" rx="5"/><text x="1128" y="413">部品を削除し手書き本文を保持する</text><text x="20" y="523">INT-NYANRAD-002-UNDO [normal]</text><rect x="20" y="534" width="259" height="92" rx="5"/><text x="28" y="553">デザイン・プロパティ・コード</text><text x="281" y="580">→</text><rect x="295" y="534" width="259" height="92" rx="5"/><text x="303" y="553">Undo・Redo</text><text x="556" y="580">→</text><rect x="570" y="534" width="259" height="92" rx="5"/><text x="578" y="553">配置等の編集を戻す・再適用する</text><text x="831" y="580">→</text><rect x="845" y="534" width="259" height="92" rx="5"/><text x="853" y="553">R/U：フォーム・部品・プロパテ</text><text x="853" y="570">ィ、R/U：イベント対応・手書き</text><text x="853" y="587">本文、R/U：編集状態・履歴</text><text x="1106" y="580">／</text><rect x="1120" y="534" width="259" height="92" rx="5"/><text x="1128" y="553">編集状態を更新し保存済みファイル</text><text x="1128" y="570">は自動巻戻ししない</text><text x="20" y="663">INT-NYANRAD-002-INVALID [exception]</text><rect x="20" y="674" width="259" height="92" rx="5"/><text x="28" y="693">デザイン・プロパティ・コード</text><text x="281" y="720">→</text><rect x="295" y="674" width="259" height="92" rx="5"/><text x="303" y="693">名前・配置値変更</text><text x="556" y="720">→</text><rect x="570" y="674" width="259" height="92" rx="5"/><text x="578" y="693">不正な変更を拒否する</text><text x="831" y="720">→</text><rect x="845" y="674" width="259" height="92" rx="5"/><text x="853" y="693">R：フォーム・部品・プロパティ、</text><text x="853" y="710">R：編集状態・履歴</text><text x="1106" y="720">／</text><rect x="1120" y="674" width="259" height="92" rx="5"/><text x="1128" y="693">以前の値を保持し理由を表示