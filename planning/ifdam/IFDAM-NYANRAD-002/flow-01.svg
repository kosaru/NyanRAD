<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1255" viewBox="0 0 1400 1255"><style>text{font-family:system-ui,sans-serif;fill:#203047;font-size:14px}rect{stroke:#9aacbd;fill:#f5f8fc}.title{font-size:22px;font-weight:bold}</style><text x="20" y="30" class="title">フォームと画面イベントを編集する 1/3 — draft</text><text x="20" y="58">画面 → 操作 → 機能 → データ操作 ／ 結果（条件は確認表を参照）</text><text x="20" y="88">INT-NYANRAD-002-EDIT [normal]</text><rect x="20" y="99" width="259" height="120" rx="5"/><text x="28" y="118">デザイン・プロパティ・コード</text><text x="281" y="153">→</text><rect x="295" y="99" width="259" height="120" rx="5"/><text x="303" y="118">配置・プロパティ変更</text><text x="556" y="153">→</text><rect x="570" y="99" width="259" height="120" rx="5"/><text x="578" y="118">フォームと部品を編集する</text><text x="831" y="153">→</text><rect x="845" y="99" width="259" height="120" rx="5"/><text x="853" y="118">R/C/U：フォーム・部品・プロ</text><text x="853" y="133">パティ、C/U：編集状態・履歴</text><text x="1106" y="153">／</text><rect x="1120" y="99" width="259" height="120" rx="5"/><text x="1128" y="118">変更と未保存状態を表示する</text><text x="20" y="253">INT-NYANRAD-002-EVENT [normal]</text><rect x="20" y="264" width="259" height="120" rx="5"/><text x="28" y="283">デザイン・プロパティ・コード</text><text x="281" y="318">→</text><rect x="295" y="264" width="259" height="120" rx="5"/><text x="303" y="283">イベント選択</text><text x="556" y="318">→</text><rect x="570" y="264" width="259" height="120" rx="5"/><text x="578" y="283">イベント処理を開く</text><text x="831" y="318">→</text><rect x="845" y="264" width="259" height="120" rx="5"/><text x="853" y="283">R：IDE管理のイベント対応・結</text><text x="853" y="298">線、C/U：編集状態・履歴、R：</text><text x="853" y="313">手書きイベント処理本文</text><text x="1106" y="318">／</text><rect x="1120" y="264" width="259" height="120" rx="5"/><text x="1128" y="283">既存本文または初回の雛形を開く</text><text x="20" y="418">INT-NYANRAD-002-DELETE [normal]</text><rect x="20" y="429" width="259" height="120" rx="5"/><text x="28" y="448">デザイン・プロパティ・コード</text><text x="281" y="483">→</text><rect x="295" y="429" width="259" height="120" rx="5"/><text x="303" y="448">部品削除</text><text x="556" y="483">→</text><rect x="570" y="429" width="259" height="120" rx="5"/><text x="578" y="448">部品と管理結線を削除する</text><text x="831" y="483">→</text><rect x="845" y="429" width="259" height="120" rx="5"/><text x="853" y="448">R/D：フォーム・部品・プロパテ</text><text x="853" y="463">ィ、R/U：IDE管理のイベント</text><text x="853" y="478">対応・結線、C/U：編集状態・履</text><text x="853" y="493">歴、R：手書きイベント処理本文</text><text x="1106" y="483">／</text><rect x="1120" y="429" width="259" height="120" rx="5"/><text x="1128" y="448">部品を削除し手書き本文を保持する</text><text x="20" y="583">INT-NYANRAD-002-UNDO [normal]</text><rect x="20" y="594" width="259" height="120" rx="5"/><text x="28" y="613">デザイン・プロパティ・コード</text><text x="281" y="648">→</text><rect x="295" y="594" width="259" height="120" rx="5"/><text x="303" y="613">Undo・Redo</text><text x="556" y="648">→</text><rect x="570" y="594" width="259" height="120" rx="5"/><text x="578" y="613">配置等の編集を戻す・再適用する</text><text x="831" y="648">→</text><rect x="845" y="594" width="259" height="120" rx="5"/><text x="853" y="613">R/U：フォーム・部品・プロパテ</text><text x="853" y="628">ィ、R/U：IDE管理のイベント</text><text x="853" y="643">対応・結線、R/U：編集状態・履</text><text x="853" y="658">歴、R：手書きイベント処理本文</text><text x="1106" y="648">／</text><rect x="1120" y="594" width="259" height="120" rx="5"/><text x="1128" y="613">編集状態を更新し保存済みファイル</text><text x="1128" y="628">は自動巻戻ししない</text><text x="20" y="748">INT-NYANRAD-002-INVALID [exception]</text><rect x="20" y="759" width="259" height="120" rx="5"/><text x="28" y="778">デザイン・プロパティ・コード</text><text x="281" y="813">→</text><rect x="295" y="759" width="259" height="120" rx="5"/><text x="303" y="778">名前・配置値変更</text><text x="556" y="813">→</text><rect x="570" y="759" width="259" height="120" rx="5"/><text x="578" y="778">不正な変更を拒否する</text><text x="831" y="813">→</text><rect x="845" y="759" width="259" height="120" rx="5"/><text x="853" y="778">R：フォーム・部品・プロパティ、</text><text x="853" y="793">R：編集状態・履歴</text><text x="1106" y="813">／</text><rect x="1120" y="759" width="259" height="120" rx="5"/><text x="1128" y="778">以前の値を保持し理由を表示する</text><text x="20" y="913">INT-NYANRAD-002-UNSUPPORTED [alternative]</text><rect x="20" y="924" width="259" height="120" rx="5"/><text x="28" y="943">デザイン・プロパティ・コード</text><text x="281" y="978">→</text><rect x="295" y="924" width="259" height="120" rx="5"/><text x="303" y="943">ソース再読込</text><text x="556" y="978">→</text><rect x="570" y="924" width="259" height="120" rx="5"/><text x="578" y="943">再編集範囲を示す</text><text x="831" y="978">→</text><rect x="845" y="924" width="259" height="120" rx="5"/><text x="853" y="943">R：フォーム・部品・プロパティ、</text><text x="853" y="958">R：IDE管理のイベント対応・結</text><text x="853" y="973">線、C/U：編集状態・履歴、R：</text><text x="853" y="988">手書きイベント処理本文</text><text x="1106" y="978">／</text><rect x="1120" y="924" width="259" height="120" rx="5"/><text x="1128" y="943">ソースを保持し編集制限の範囲と理</text><text x="1128" y="958">由を示す</text><text x="20" y="1078">INT-NYANRAD-002-COPY [normal]</text><rect x="20" y="1089" width="259" height="120" rx="5"/><text x="28" y="1108">デザイン・プロパティ・コード</text><text x="281" y="1143">→</text><rect x="295" y="1089" width="259" height="120" rx="5"/><text x="303" y="1108">部品をコピー</text><text x="556" y="1143">→</text><rect x="570" y="1089" width="259" height="120" rx="5"/><text x="578" y="1108">部品を複製する</text><text x="831" y="1143">→</text><rect x="845" y="1089" width="259" height="120" rx="5"/><text x="853" y="1108">R/C：フォーム・部品・プロパテ</text><text x="853" y="1123">ィ、R：IDE管理のイベント対応</text><text x="853" y="1138">・結線、C/U：編集状態・履歴、</text><text x="853" y="1153">R：手書きイベント処理本文</text><text x="1106" y="1143">／</text><rect x="1120" y="1089" width="259" height="120" rx="5"/><text x="1128" y="1108">新しい名前で複製し手書き本文は複</text><text x="1128" y="1123">製せず元のイベント処理の存在を示</text><text x="1128" y="1138">す</text></svg>